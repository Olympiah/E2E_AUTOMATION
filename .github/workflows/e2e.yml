name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Full regression nightly at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which suite to run'
        type: choice
        options: [smoke, regression]
        default: smoke

permissions:
  contents: read
  issues: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: ${{ vars.BASE_URL || 'https://opensource-demo.orangehrmlive.com' }}
      LOGIN_USERNAME: ${{ secrets.LOGIN_USERNAME }}
      LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Determine test grep
        id: grep
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.suite }}" = "regression" ]; then
            echo "pattern=@regression|@smoke" >> "$GITHUB_OUTPUT"
          else
            echo "pattern=@smoke" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Playwright tests
        run: npx playwright test --grep "${{ steps.grep.outputs.pattern }}"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14

      - name: File issue on regression failure
        if: failure() && (github.event_name == 'schedule' || steps.grep.outputs.pattern == '@regression|@smoke')
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'e2e-failure';
            const trigger = context.eventName === 'schedule' ? 'Nightly' : 'Manually triggered';
            const title = `${trigger} E2E regression failed`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });

            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body: `Still failing: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: [label],
                body: `The nightly full regression run failed.\n\nRun: ${runUrl}\n\nDownload the \`playwright-report\` artifact from that run for screenshots/traces. This issue stays open and gets a new comment on each subsequent failure; close it once the suite is green again.`,
              });
            }
